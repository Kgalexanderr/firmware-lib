

CONFIG_LAMB_RGB_LED=y
CONFIG_PWM=y # Enable the underlying hardware PWM driver (leaving this CONFIG_PWM=y the RGB led will stay white)
CONFIG_LED=y # Enable the generic LED API
CONFIG_LED_PWM=y # Enable the specific PWM-based LED driver

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
